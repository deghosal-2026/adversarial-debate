repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: tests
        name: pytest (hermetic)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
